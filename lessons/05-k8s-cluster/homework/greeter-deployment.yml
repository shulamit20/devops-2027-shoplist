apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greeter
  template:
    metadata:
      labels:
        app: greeter
    spec:
      containers:
        - name: greeter
          image: greeter:v1
          imagePullPolicy: Never
          env:
            - name: GREETING
              value: "Hello, World!"
          ports:
            - containerPort: 8000